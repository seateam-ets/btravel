openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: API du site public et de l'administration B-TRAVEL
servers:
  - url: /api
    description: Base API path
security:
  - ClerkSession: []
tags:
  - { name: health, description: État du service }
  - { name: public, description: Parcours publics }
  - { name: admin, description: Administration protégée }
  - { name: storage, description: Fichiers publics et privés }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      responses:
        "200":
          description: Service disponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /public/trips:
    get:
      operationId: listPublicTrips
      tags: [public]
      security: []
      responses:
        "200":
          description: Voyages publiés
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicTrip" }
  /public/trips/{id}:
    get:
      operationId: getPublicTrip
      tags: [public]
      security: []
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Voyage publié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTrip" }
        "404": { $ref: "#/components/responses/NotFound" }
  /quote-requests:
    post:
      operationId: createQuoteRequest
      tags: [public]
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 16, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequestInput" }
      responses:
        "201":
          description: Demande enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /trip-requests:
    post:
      operationId: createTripRequest
      tags: [public]
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 16, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripRequestInput" }
      responses:
        "201":
          description: Demande enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /contact-messages:
    post:
      operationId: createContactMessage
      tags: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageInput" }
      responses:
        "201":
          description: Message enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmissionReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/contact-messages:
    get:
      operationId: listContactMessages
      tags: [admin]
      responses:
        "200":
          description: Demandes de contact
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactMessage" }
  /admin/contact-messages/{id}/status:
    patch:
      operationId: updateContactMessageStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactMessageStatusInput" }
      responses:
        "200":
          description: Statut modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactMessage" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/dashboard:
    get:
      operationId: getDashboard
      tags: [admin]
      responses:
        "200":
          description: Indicateurs et éléments prioritaires
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/clients:
    get:
      operationId: listClients
      tags: [admin]
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }
    post:
      operationId: createClient
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Client créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/clients/{id}:
    get:
      operationId: getClient
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateClient
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientUpdate" }
      responses:
        "200":
          description: Client modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
  /admin/quote-requests:
    get:
      operationId: listQuoteRequests
      tags: [admin]
      parameters:
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Demandes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteRequest" }
    post:
      operationId: createManualQuoteRequest
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequestInput" }
      responses:
        "201":
          description: Demande créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteRequest" }
  /admin/quote-requests/{id}/status:
    patch:
      operationId: updateQuoteRequestStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequestStatusInput" }
      responses:
        "200":
          description: Demande modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteRequest" }
  /admin/clients/{id}/history:
    get:
      operationId: getClientHistory
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Historique métier du client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientHistory" }
  /admin/quotes:
    get:
      operationId: listQuotes
      tags: [admin]
      responses:
        "200":
          description: Devis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Quote" }
    post:
      operationId: createQuote
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteInput" }
      responses:
        "201":
          description: Devis créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /admin/quotes/{id}/status:
    patch:
      operationId: updateQuoteStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteStatusInput" }
      responses:
        "200":
          description: Statut modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /admin/quotes/{id}/decision:
    post:
      operationId: recordQuoteDecision
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteDecisionInput" }
      responses:
        "200":
          description: Réponse du client enregistrée par B-TRAVEL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quote" }
  /admin/quotes/{id}/convert:
    post:
      operationId: convertQuoteToTransport
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "201":
          description: Transport créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transport" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/transports:
    get:
      operationId: listTransports
      tags: [admin]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Transports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transport" }
    post:
      operationId: createTransport
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransportInput" }
      responses:
        "201":
          description: Transport créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transport" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/transports/{id}:
    patch:
      operationId: updateTransport
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransportUpdate" }
      responses:
        "200":
          description: Transport modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transport" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/schedule/conflicts:
    post:
      operationId: checkScheduleConflicts
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleConflictInput" }
      responses:
        "200":
          description: Conflits détectés pour le créneau
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleConflictResult" }
  /admin/schedule/occurrences:
    get:
      operationId: listScheduleOccurrences
      tags: [admin]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string, format: date }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Transports et occurrences récurrentes sur la période
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleOccurrence" }
  /admin/transports/{id}/mission-sheet:
    get:
      operationId: getMissionSheet
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Données imprimables de la fiche de mission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionSheet" }
  /admin/recurring-routes:
    get:
      operationId: listRecurringRoutes
      tags: [admin]
      responses:
        "200":
          description: Trajets récurrents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecurringRoute" }
    post:
      operationId: createRecurringRoute
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringRouteInput" }
      responses:
        "201":
          description: Trajet créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRoute" }
  /admin/recurring-routes/{id}:
    patch:
      operationId: updateRecurringRoute
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringRouteUpdate" }
      responses:
        "200":
          description: Trajet récurrent modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringRoute" }
  /admin/vehicles:
    get:
      operationId: listVehicles
      tags: [admin]
      responses:
        "200":
          description: Véhicules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
    post:
      operationId: createVehicle
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Véhicule créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /admin/vehicles/{id}:
    patch:
      operationId: updateVehicle
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleUpdate" }
      responses:
        "200":
          description: Véhicule modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
  /admin/drivers:
    get:
      operationId: listDrivers
      tags: [admin]
      responses:
        "200":
          description: Chauffeurs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Driver" }
    post:
      operationId: createDriver
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverInput" }
      responses:
        "201":
          description: Chauffeur créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
  /admin/drivers/{id}:
    patch:
      operationId: updateDriver
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverUpdate" }
      responses:
        "200":
          description: Chauffeur modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
  /admin/trips:
    get:
      operationId: listAdminTrips
      tags: [admin]
      responses:
        "200":
          description: Voyages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTrip" }
    post:
      operationId: createTrip
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripInput" }
      responses:
        "201":
          description: Voyage créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTrip" }
  /admin/trips/{id}:
    patch:
      operationId: updateTrip
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripUpdate" }
      responses:
        "200":
          description: Voyage modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTrip" }
  /admin/trip-requests:
    get:
      operationId: listTripRequests
      tags: [admin]
      responses:
        "200":
          description: Demandes de places
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TripRequest" }
  /admin/trip-requests/{id}/status:
    patch:
      operationId: updateTripRequestStatus
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripRequestStatusInput" }
      responses:
        "200":
          description: Demande modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/trip-requests/{id}/passengers:
    get:
      operationId: listPassengers
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Passagers d’une demande confirmée
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passenger" }
    post:
      operationId: createPassenger
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerInput" }
      responses:
        "201":
          description: Passager ajouté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passenger" }
  /admin/passengers/{id}:
    patch:
      operationId: updatePassenger
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerUpdate" }
      responses:
        "200":
          description: Passager modifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passenger" }
  /admin/invoices:
    get:
      operationId: listInvoices
      tags: [admin]
      responses:
        "200":
          description: Factures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
    post:
      operationId: createInvoice
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceInput" }
      responses:
        "201":
          description: Facture créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
  /admin/invoice-settings:
    get:
      operationId: getInvoiceSettings
      tags: [admin]
      responses:
        "200":
          description: État de validation comptable et paramètres
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSettings" }
    put:
      operationId: updateInvoiceSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSettingsInput" }
      responses:
        "200":
          description: Paramètres enregistrés
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceSettings" }
  /admin/invoices/{id}/issue:
    post:
      operationId: issueInvoice
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Facture émise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/payments:
    post:
      operationId: recordPayment
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "201":
          description: Paiement enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /admin/tasks:
    get:
      operationId: listTasks
      tags: [admin]
      responses:
        "200":
          description: Tâches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTask" }
    post:
      operationId: createTask
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Tâche créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTask" }
  /admin/tasks/{id}:
    patch:
      operationId: updateTask
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Tâche modifiée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTask" }
  /admin/documents:
    get:
      operationId: listDocuments
      tags: [admin]
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Document" }
    post:
      operationId: createDocument
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentInput" }
      responses:
        "201":
          description: Document enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: URL créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      security: []
      parameters:
        - in: path
          name: filePath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Fichier public
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      parameters:
        - in: path
          name: objectPath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Document privé
          content:
            "*/*":
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Connexion requise
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Élément introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Conflit métier
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    HealthStatus:
